<!DOCTYPE html>

<body>
    <div class="navbar">
        <h1>ADHD Support App</h1>
    </div>

    <div class="container">
        <div class="hero">
            <div class="stat-badge">600,000+</div>
            <p>Australians living with ADHD</p>
            <h2>Support Tools</h2>
        </div>

        <div class="tool-grid">
            <div class="tool-card">
                <h3>Task Decomposition</h3>
                <p>Break down complex tasks into manageable steps.</p>
                <a href="/task"><button>Get Started</button></a>
            </div>

            <div class="tool-card">
                <h3>Insights</h3>
                <p>Explore health and activity benchmarks for your age group.</p>
                <a href="/insights"><button>Get Started</button></a>
            </div>
        </div>

        <div class="support-section">
            <h3>Support Services</h3>
            <div class="support-links">
                <a href="https://www.adhdaustralia.org.au/" target="_blank">

                    <button type="button">Beyond Blue</button>
                </a>
        
                <button type="button" onclick="showSupportEmail()">Support Email</button>
            </div>
        </div>
    </div>
</body>
